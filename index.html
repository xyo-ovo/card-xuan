<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>赛博塔罗 · 韦特之馆</title>
<style>
:root{
  --gold:#e8c97a;
  --gold2:#ffdf8e;
  --txt:#f3e9d2;
  --line:rgba(232,201,122,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;color:var(--txt);
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun",serif;
  background:
    radial-gradient(900px 520px at 50% -6%, #2c1a55 0%, rgba(44,26,85,0) 62%),
    radial-gradient(820px 460px at 88% 108%, #1a0f38 0%, rgba(26,15,56,0) 58%),
    linear-gradient(180deg,#0d0819 0%,#090512 100%);
  overflow-x:hidden;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
main{position:relative;z-index:1;width:min(720px,94vw);margin:0 auto;padding:44px 0 100px;text-align:center;}
h1{font-size:clamp(1.6rem,6.4vw,2.15rem);font-weight:600;letter-spacing:.3em;text-indent:.3em;color:var(--gold2);text-shadow:0 0 18px rgba(255,223,142,.5),0 0 46px rgba(255,223,142,.18);}
.sub{margin-top:10px;font-size:.78rem;letter-spacing:.3em;text-indent:.3em;color:rgba(243,233,210,.45);}

.icon-btn{
  position:fixed;top:16px;right:16px;z-index:20;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(30,18,60,.75);color:var(--gold2);
  font-size:1.15rem;cursor:pointer;backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.icon-btn:active{transform:scale(.92);}

section{margin-top:32px;}
.hint{font-size:.88rem;color:rgba(243,233,210,.6);letter-spacing:.08em;}

.spreads{display:grid;grid-template-columns:1fr;gap:10px;}
.spread{
  display:flex;flex-direction:column;gap:4px;align-items:center;
  padding:14px 10px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:rgba(243,233,210,.75);font-family:inherit;font-size:1rem;
  letter-spacing:.08em;transition:all .25s;
}
.spread span{font-size:.74rem;color:rgba(243,233,210,.42);letter-spacing:.1em;}
.spread.active{
  border-color:rgba(255,223,142,.8);color:var(--gold2);
  background:linear-gradient(180deg,rgba(255,223,142,.16),rgba(255,223,142,.05));
  box-shadow:0 0 24px rgba(255,223,142,.15);
}
@media(min-width:560px){.spreads{grid-template-columns:repeat(3,1fr);}}

#question{
  width:100%;margin-top:16px;padding:13px 16px;resize:none;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.04);color:var(--txt);
  font-family:inherit;font-size:.98rem;line-height:1.6;letter-spacing:.05em;
  outline:none;transition:border-color .25s, box-shadow .25s;
}
#question::placeholder{color:rgba(243,233,210,.32);}
#question:focus{border-color:rgba(255,223,142,.7);box-shadow:0 0 0 3px rgba(255,223,142,.12);}

.main-btn{
  margin-top:22px;padding:14px 52px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,223,142,.65);
  background:linear-gradient(180deg,rgba(255,223,142,.18),rgba(255,223,142,.05));
  color:var(--gold2);font-family:inherit;font-size:1.05rem;
  letter-spacing:.32em;text-indent:.32em;
  box-shadow:0 0 26px rgba(255,223,142,.15);
  transition:all .25s;
}
.main-btn:active:not(:disabled){transform:scale(.97);}
.main-btn:disabled{opacity:.5;cursor:default;}

.card-table{display:grid;justify-content:center;margin-top:26px;}
.card-table.g1{grid-template-columns:minmax(0,190px);}
.card-table.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;max-width:600px;margin-left:auto;margin-right:auto;}
.card-table.g10{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;max-width:460px;margin-left:auto;margin-right:auto;}
.slot{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0;}
.slot-label{font-size:.74rem;letter-spacing:.08em;color:rgba(243,233,210,.55);line-height:1.4;}
.g10 .slot-label{font-size:.78rem;}

.tcard{
  width:100%;max-width:190px;aspect-ratio:3/5;perspective:1000px;cursor:pointer;
  transition:transform .3s;
}
.tcard:active{transform:scale(.97);}
.tcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.35,.1,.25,1);}
.tcard.flipped .inner{transform:rotateY(180deg);}
.tcard .face{
  position:absolute;inset:0;border-radius:10px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.tcard .back{
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%, #33206b 0%, #1a0f3d 68%, #120a2c 100%);
  border:2px solid rgba(232,201,122,.75);
  box-shadow:inset 0 0 0 1px rgba(232,201,122,.2), inset 0 0 34px rgba(0,0,0,.65);
}
.tcard .back::before{content:'';position:absolute;inset:7px;border:1px solid rgba(232,201,122,.4);border-radius:6px;}
.tcard .back::after{
  content:'☾';color:var(--gold);font-size:1.6rem;
  text-shadow:0 0 12px rgba(255,223,142,.9);
  animation:breath 2.6s ease-in-out infinite;
}
@keyframes breath{0%,100%{opacity:.55;}50%{opacity:1;}}
.tcard .front{
  transform:rotateY(180deg);
  background:linear-gradient(180deg,#f7f1e0,#e9dfc6);
  border:2px solid rgba(232,201,122,.85);
  box-shadow:0 6px 26px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
}
.tcard .front img{width:100%;height:100%;object-fit:cover;display:block;}
.tcard.reversed .front img{transform:rotate(180deg);}
.tcard .fallback{
  display:none;flex-direction:column;align-items:center;gap:6px;
  color:#4a3617;padding:10px;text-align:center;
}
.tcard.noimg .fallback{display:flex;}
.tcard .fallback .sym{font-size:2rem;}
.tcard .fallback .nm{font-size:.8rem;font-weight:700;letter-spacing:.05em;line-height:1.4;}
.tcard .fallback .ori{font-size:.68rem;color:#7a5c28;}

.ai-box{
  margin-top:26px;padding:22px 20px;text-align:left;min-height:80px;
  border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(38,22,66,.85),rgba(19,11,36,.9));
  box-shadow:0 18px 48px rgba(0,0,0,.45);
  font-size:.98rem;line-height:2;color:rgba(243,233,210,.92);
  word-break:break-word;
}
.ai-box h3{color:var(--gold2);margin:14px 0 6px;font-size:1.02rem;letter-spacing:.08em;}
.ai-box h3:first-child{margin-top:0;}
.ai-box b{color:var(--gold2);}
.ai-box .placeholder{color:rgba(243,233,210,.45);text-align:center;}
.ai-box .err{color:#f0a6a6;}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
.actions button{
  padding:12px 22px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);font-family:inherit;font-size:.94rem;letter-spacing:.12em;
  transition:all .25s;
}
.actions button:active{transform:scale(.96);}
.actions button.primary{
  border-color:rgba(255,223,142,.7);color:var(--gold2);
  background:linear-gradient(180deg,rgba(255,223,142,.16),rgba(255,223,142,.05));
  box-shadow:0 0 22px rgba(255,223,142,.14);
}
.actions button:disabled{opacity:.5;cursor:default;}

.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,3,14,.72);backdrop-filter:blur(4px);}
.modal[hidden]{display:none;}
.modal-card{
  width:min(420px,100%);max-height:86vh;overflow-y:auto;text-align:left;
  padding:24px 22px;border-radius:18px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#241544,#150c2e);
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.modal-card h2{font-size:1.1rem;color:var(--gold2);letter-spacing:.2em;text-align:center;margin-bottom:6px;}
.modal-card .note{font-size:.76rem;color:rgba(243,233,210,.45);text-align:center;line-height:1.7;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.82rem;color:rgba(243,233,210,.62);margin-bottom:6px;letter-spacing:.08em;}
.field input,.field select{
  width:100%;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--txt);font-family:inherit;font-size:.92rem;outline:none;
}
.field input:focus,.field select:focus{border-color:rgba(255,223,142,.7);}
.field select option{background:#1c1138;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions button{flex:1;padding:12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.95rem;letter-spacing:.1em;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);}
.modal-actions button.primary{border-color:rgba(255,223,142,.7);color:var(--gold2);background:linear-gradient(180deg,rgba(255,223,142,.16),rgba(255,223,142,.05));}

.foot{margin-top:44px;font-size:.74rem;letter-spacing:.14em;color:rgba(243,233,210,.3);line-height:2;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button class="icon-btn" id="settingsBtn" title="API 设置">⚙</button>

<main>
  <h1>赛博塔罗</h1>
  <div class="sub">韦特之馆 · 78 张原版牌面</div>

  <section id="stepSetup">
    <div class="spreads" id="spreads">
      <button class="spread active" data-spread="1">🌙 每日一牌<span>1 张 · 今日指引</span></button>
      <button class="spread" data-spread="3">🕰 时间之流<span>3 张 · 过去现在未来</span></button>
      <button class="spread" data-spread="10">✚ 凯尔特十字<span>10 张 · 深度剖析</span></button>
    </div>
    <textarea id="question" rows="2" maxlength="200" placeholder="写下你想问的问题（可留空）…"></textarea>
    <br>
    <button class="main-btn" id="shuffleBtn">洗 牌</button>
  </section>

  <section id="stepDraw" hidden>
    <p class="hint" id="drawHint">深呼吸，凭直觉点击翻开每一张牌</p>
    <div class="card-table" id="cardTable"></div>
  </section>

  <section id="stepRead" hidden>
    <div class="ai-box" id="aiBox"><div class="placeholder">牌面已全部翻开 —— 点击下方按钮获取解读 ✨</div></div>
    <div class="actions">
      <button class="primary" id="aiBtn">🔮 AI 解读</button>
      <button id="copyBtn">📋 复制牌面</button>
      <button id="againBtn">🔄 重新开始</button>
    </div>
  </section>

  <div class="foot">✦ 塔罗是自我对话的镜子 · 命运掌握在自己手里 ✦</div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2>AI 解读设置</h2>
    <div class="note">填入任意 OpenAI 兼容接口即可，供应商与地址均可自定义。<br>Key 只保存在你手机本地，不会上传到任何地方。</div>
    <div class="field">
      <label>供应商（选择后自动填入地址与模型，可再手动修改）</label>
      <select id="provSel">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="moonshot">月之暗面 Kimi</option>
        <option value="qwen">通义千问</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="field">
      <label>接口地址 (Base URL)</label>
      <input id="baseUrl" type="text" placeholder="https://api.deepseek.com/v1" autocomplete="off">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input id="model" type="text" placeholder="deepseek-chat" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button id="closeModal">关闭</button>
      <button class="primary" id="saveCfg">保存</button>
    </div>
  </div>
</div>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
